<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="1080" viewBox="0 0 1456 1080" role="img" aria-labelledby="title desc">
  <title id="title">ECR-Repair: Evidence-Constrained Neuro-Symbolic Ontology Repair</title>
  <desc id="desc">Vector recreation of a four-stage framework diagram for ECR-Repair with process cards, arrows, annotations, and legend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfbfb"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f8ff"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5fff8"/>
    </linearGradient>
    <linearGradient id="tealPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2fcff"/>
    </linearGradient>
    <linearGradient id="formalPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f9ff"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdfdfd"/>
    </linearGradient>
    <linearGradient id="badgeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173f91"/>
      <stop offset="1" stop-color="#0c2c76"/>
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24864c"/>
      <stop offset="1" stop-color="#116236"/>
    </linearGradient>
    <linearGradient id="badgeTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#116f7d"/>
      <stop offset="1" stop-color="#075968"/>
    </linearGradient>
    <linearGradient id="badgeFormal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4d82"/>
      <stop offset="1" stop-color="#183762"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-18%" width="130%" height="145%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#d5d5d5" flood-opacity="0.65"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#000"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#000"/>
    </marker>
    <style>
      .font { font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 41px; font-weight: 800; fill: #000; }
      .panel-title { font-size: 24px; font-weight: 800; }
      .card-title { font-size: 23px; font-weight: 800; fill: #000; }
      .card-text { font-size: 18px; fill: #000; }
      .small-note { font-size: 18px; font-style: italic; }
      .flow-label { font-size: 16px; font-style: italic; fill: #000; }
      .panel { stroke-width: 1.7; }
      .card { fill: url(#cardFill); stroke: #8b8b8b; stroke-width: 1.5; filter: url(#softShadow); }
      .main-flow { stroke: #000; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .conditional-flow { stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrowSmall); }
      .icon-blue { stroke: #0b3280; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-green { stroke: #0f6838; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-teal { stroke: #075e6e; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-formal { stroke: #0d347b; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1456" height="1080" fill="url(#bg)"/>
  <text x="728" y="50" text-anchor="middle" class="font title">ECR-Repair: Evidence-Constrained Neuro-Symbolic Ontology Repair</text>

  <!-- Source document -->
  <g id="source-doc" class="font">
    <rect x="506" y="75" width="456" height="60" rx="8" class="card"/>
    <g transform="translate(544 88)">
      <path d="M0 0 H22 L31 9 V36 H0 Z" class="icon-formal"/>
      <path d="M22 0 V10 H31" class="icon-formal"/>
      <path d="M7 11 H19 M7 18 H23 M7 25 H20" class="icon-formal"/>
    </g>
    <text x="596" y="115" class="font card-title">Versioned Normative Documents</text>
  </g>

  <!-- Layer 1 -->
  <g id="layer-1" class="font">
    <rect x="20" y="143" width="1407" height="202" rx="13" fill="url(#bluePanel)" stroke="#0b3280" class="panel"/>
    <circle cx="59" cy="175" r="23" fill="url(#badgeBlue)"/>
    <text x="59" y="184" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">1</text>
    <text x="104" y="182" class="panel-title" fill="#0b3280">Neural Semantic Interpretation</text>
    <text x="1402" y="181" text-anchor="end" class="small-note" fill="#0b3280">candidate content isolated</text>

    <rect x="104" y="200" width="335" height="132" rx="9" class="card"/>
    <g transform="translate(123 223)">
      <circle cx="23" cy="23" r="22" class="icon-blue"/>
      <path d="M38 39 L58 59" class="icon-blue"/>
      <path d="M18 15 H33 M18 23 H33 M18 31 H33" class="icon-blue"/>
    </g>
    <text x="217" y="233" class="card-title">Predicate-aware</text>
    <text x="217" y="259" class="card-title">Evidence Focus</text>
    <text x="217" y="291" class="card-text">Isolate and emphasize</text>
    <text x="217" y="315" class="card-text">relevant evidence</text>

    <rect x="544" y="200" width="372" height="132" rx="9" class="card"/>
    <g transform="translate(574 218)">
      <path d="M35 4 V70 M3 35 H68" class="icon-blue"/>
      <rect x="25" y="18" width="20" height="34" class="icon-blue"/>
      <path d="M3 26 C3 16 16 16 17 25 C17 11 31 11 32 22 C38 8 52 14 49 28 C63 28 65 45 51 48 C55 62 39 68 32 55 C25 72 7 63 14 47 C3 47 -3 37 3 26 Z" class="icon-blue"/>
      <circle cx="35" cy="4" r="3" fill="#0b3280"/><circle cx="3" cy="35" r="3" fill="#0b3280"/><circle cx="68" cy="35" r="3" fill="#0b3280"/>
      <circle cx="35" cy="70" r="3" fill="#0b3280"/><circle cx="56" cy="18" r="3" fill="#0b3280"/><circle cx="58" cy="54" r="3" fill="#0b3280"/>
    </g>
    <text x="676" y="233" class="card-title">Base Semantic IR</text>
    <text x="676" y="259" class="card-title">Pipeline (LLM)</text>
    <text x="676" y="291" class="card-text">Generate base semantic IR</text>
    <text x="676" y="315" class="card-text">from isolated content</text>

    <rect x="1013" y="200" width="370" height="132" rx="9" class="card"/>
    <g transform="translate(1038 226)">
      <path d="M0 0 H29 L41 12 V58 H0 Z" class="icon-blue"/>
      <path d="M29 0 V13 H41" class="icon-blue"/>
      <path d="M8 17 H24 M8 29 H29 M8 41 H22" class="icon-blue"/>
      <path d="M53 34 A15 15 0 1 1 42 59" class="icon-blue"/>
      <path d="M53 34 H40 M53 34 V22" class="icon-blue"/>
      <path d="M31 55 H44 M31 55 V68" class="icon-blue"/>
    </g>
    <text x="1122" y="232" class="card-title">Clause-Level Semantic</text>
    <text x="1122" y="258" class="card-title">Recovery (LLM, if needed)</text>
    <text x="1122" y="290" class="card-text">Recover missing clauses</text>
    <text x="1122" y="314" class="card-text">and refine semantics</text>
  </g>

  <!-- Layer 2 -->
  <g id="layer-2" class="font">
    <rect x="20" y="368" width="1407" height="180" rx="13" fill="url(#greenPanel)" stroke="#0f6838" class="panel"/>
    <circle cx="59" cy="399" r="23" fill="url(#badgeGreen)"/>
    <text x="59" y="408" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">2</text>
    <text x="104" y="406" class="panel-title" fill="#0f6838">Symbolic Semantic Representation</text>

    <rect x="104" y="420" width="335" height="115" rx="9" class="card"/>
    <g transform="translate(132 443)">
      <path d="M23 0 H42 L45 22 L18 49 L0 31 Z" fill="#0f6838" stroke="#0f6838" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="34" cy="12" r="4" fill="#fff"/>
    </g>
    <text x="217" y="453" class="card-title">Typed Semantic IR</text>
    <text x="217" y="484" class="card-text">Type entities, relations,</text>
    <text x="217" y="508" class="card-text">constraints</text>

    <rect x="544" y="420" width="372" height="115" rx="9" class="card"/>
    <g transform="translate(576 438)">
      <path d="M32 8 V70" class="icon-green"/>
      <circle cx="32" cy="7" r="7" class="icon-green"/>
      <path d="M11 38 C13 60 31 70 32 70 C33 70 51 60 53 38" class="icon-green"/>
      <path d="M0 40 L11 38 L13 52" class="icon-green"/>
      <path d="M64 40 L53 38 L51 52" class="icon-green"/>
      <path d="M20 21 H44" class="icon-green"/>
    </g>
    <text x="676" y="450" class="card-title">Temporal Anchor</text>
    <text x="676" y="476" class="card-title">Recovery (deterministic)</text>
    <text x="676" y="507" class="card-text">Anchor to time/version</text>
    <text x="676" y="531" class="card-text">constraints</text>

    <rect x="1013" y="420" width="365" height="115" rx="9" class="card"/>
    <g transform="translate(1048 447)">
      <path d="M48 27 A26 26 0 1 1 40 8" class="icon-green" stroke-dasharray="9 8"/>
      <path d="M15 31 L27 43 L51 17" class="icon-green"/>
    </g>
    <text x="1134" y="449" class="card-title">Resolved /</text>
    <text x="1134" y="475" class="card-title">Incomplete</text>
    <text x="1134" y="506" class="card-text">Mark semantic IR as</text>
    <text x="1134" y="530" class="card-text">resolved or incomplete</text>
  </g>

  <line x1="20" y1="568" x2="1427" y2="568" stroke="#0b6977" stroke-width="1.7" stroke-dasharray="10 8"/>
  <rect x="1076" y="552" width="340" height="22" fill="#fbfffc"/>
  <text x="1408" y="568" text-anchor="end" class="font small-note" fill="#0f6838">candidate set enters below this boundary</text>

  <!-- Layer 3 -->
  <g id="layer-3" class="font">
    <rect x="20" y="589" width="1407" height="263" rx="13" fill="url(#tealPanel)" stroke="#075e6e" class="panel"/>
    <circle cx="59" cy="620" r="23" fill="url(#badgeTeal)"/>
    <text x="59" y="629" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3</text>
    <text x="104" y="626" class="panel-title" fill="#075e6e">Candidate-Aware Neuro-Symbolic Decision</text>
    <text x="99" y="654" class="small-note" fill="#075e6e">ranking-failure flag only; one retry; no candidate content</text>

    <rect x="108" y="669" width="330" height="140" rx="9" class="card"/>
    <g transform="translate(132 688)">
      <path d="M34 0 V63 M12 20 H56 M34 0 C31 13 18 18 12 20 M34 0 C37 13 50 18 56 20" class="icon-teal"/>
      <path d="M12 20 L2 47 H22 Z M56 20 L46 47 H66 Z" class="icon-teal"/>
      <path d="M24 63 H44 M29 54 H39" class="icon-teal"/>
      <circle cx="34" cy="0" r="3" fill="#075e6e"/><circle cx="12" cy="20" r="3" fill="#075e6e"/><circle cx="56" cy="20" r="3" fill="#075e6e"/>
    </g>
    <text x="234" y="699" class="card-title">Constraint-Aware</text>
    <text x="234" y="725" class="card-title">Ranking &amp; Gate</text>
    <text x="234" y="751" class="card-title">(symbolic)</text>
    <text x="234" y="782" class="card-text">Rank candidates under</text>
    <text x="234" y="806" class="card-text">formal constraints</text>

    <rect x="617" y="646" width="214" height="160" rx="9" class="card"/>
    <g transform="translate(701 661)">
      <circle cx="24" cy="24" r="20" class="icon-teal"/>
      <path d="M24 0 V8 M24 40 V48 M0 24 H8 M40 24 H48" class="icon-teal"/>
      <circle cx="24" cy="24" r="4" fill="#075e6e"/>
    </g>
    <text x="724" y="743" text-anchor="middle" class="card-title">SELECT</text>
    <text x="724" y="772" text-anchor="middle" class="card-text">Select top-ranked</text>
    <text x="724" y="796" text-anchor="middle" class="card-text">candidate</text>

    <rect x="1025" y="602" width="347" height="136" rx="9" class="card"/>
    <g transform="translate(1049 633)">
      <circle cx="23" cy="23" r="22" class="icon-teal"/>
      <path d="M42 42 L61 61" class="icon-teal"/>
      <path d="M23 10 V15 M23 31 V36 M10 23 H15 M31 23 H36" class="icon-teal"/>
      <path d="M17 17 L14 14 M29 29 L32 32 M29 17 L32 14 M17 29 L14 32" class="icon-teal"/>
    </g>
    <text x="1130" y="633" class="card-title">Fallback Candidate</text>
    <text x="1130" y="659" class="card-title">Entailment Verifier</text>
    <text x="1130" y="685" class="card-title">(LLM; ambiguity only)</text>
    <text x="1130" y="716" class="card-text">Verify entailment when</text>
    <text x="1130" y="740" class="card-text">ranking is ambiguous</text>

    <rect x="1079" y="764" width="254" height="79" rx="8" class="card"/>
    <text x="1206" y="792" text-anchor="middle" class="card-title">ABSTAIN</text>
    <text x="1206" y="817" text-anchor="middle" class="card-text">When no unique</text>
    <text x="1206" y="839" text-anchor="middle" class="card-text">candidate is supported</text>
  </g>

  <!-- Layer 4 -->
  <g id="layer-4" class="font">
    <rect x="20" y="865" width="1407" height="154" rx="11" fill="url(#formalPanel)" stroke="#183762" class="panel"/>
    <circle cx="59" cy="895" r="23" fill="url(#badgeFormal)"/>
    <text x="59" y="904" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">4</text>
    <text x="104" y="902" class="panel-title" fill="#183762">Formal Symbolic Validation</text>

    <rect x="104" y="915" width="279" height="92" rx="9" class="card"/>
    <g transform="translate(122 935)">
      <circle cx="6" cy="6" r="6" class="icon-formal"/><circle cx="46" cy="6" r="6" class="icon-formal"/>
      <circle cx="6" cy="44" r="6" class="icon-formal"/><circle cx="46" cy="44" r="6" class="icon-formal"/>
      <circle cx="26" cy="25" r="5" class="icon-formal"/>
      <path d="M11 10 L22 21 M41 10 L30 21 M11 40 L22 29 M41 40 L30 29" class="icon-formal"/>
    </g>
    <text x="201" y="946" class="card-title" font-size="21">OWL/RDF Patch</text>
    <text x="201" y="970" class="card-text">Encode selected repair</text>
    <text x="201" y="993" class="card-text">as ontology patch</text>

    <rect x="449" y="915" width="252" height="92" rx="9" class="card"/>
    <g transform="translate(480 929)">
      <path d="M25 0 L51 14 H-1 Z" fill="#0d347b"/>
      <path d="M6 18 V50 M20 18 V50 M34 18 V50 M48 18 V50" class="icon-formal"/>
      <path d="M0 55 H55 M5 62 H50" class="icon-formal"/>
    </g>
    <text x="558" y="945" class="card-title">Reasoner</text>
    <text x="558" y="970" class="card-text">Check logical</text>
    <text x="558" y="993" class="card-text">consistency</text>

    <rect x="776" y="915" width="248" height="92" rx="9" class="card"/>
    <g transform="translate(799 933)">
      <circle cx="6" cy="6" r="6" class="icon-formal"/><circle cx="46" cy="6" r="6" class="icon-formal"/>
      <circle cx="6" cy="44" r="6" class="icon-formal"/><circle cx="46" cy="44" r="6" class="icon-formal"/>
      <circle cx="26" cy="25" r="5" class="icon-formal"/>
      <path d="M11 10 L22 21 M41 10 L30 21 M11 40 L22 29 M41 40 L30 29" class="icon-formal"/>
    </g>
    <text x="879" y="945" class="card-title">RDF Graph &#916;</text>
    <text x="879" y="970" class="card-text">Compute graph</text>
    <text x="879" y="993" class="card-text">difference</text>

    <rect x="1099" y="915" width="273" height="92" rx="9" class="card"/>
    <g transform="translate(1124 934)">
      <path d="M0 51 H55 M0 51 V7" class="icon-formal"/>
      <path d="M8 39 L22 24 L34 31 L50 12" class="icon-formal"/>
    </g>
    <text x="1194" y="945" class="card-title">CQ Regression</text>
    <text x="1194" y="970" class="card-text">Regression test with</text>
    <text x="1194" y="993" class="card-text">competency questions</text>
  </g>

  <!-- Inter-card and inter-layer arrows -->
  <g id="flows">
    <path d="M731 135 V194" class="main-flow"/>
    <path d="M439 260 H539" class="main-flow"/>
    <path d="M916 260 H1008" class="main-flow"/>
    <path d="M731 332 V362" class="main-flow"/>

    <path d="M439 469 H539" class="main-flow"/>
    <path d="M916 469 H1008" class="main-flow"/>
    <path d="M731 535 V585" class="main-flow"/>

    <path d="M438 723 H612" class="main-flow"/>
    <path d="M831 672 H1020" class="main-flow"/>
    <path d="M1025 727 H836" class="main-flow"/>
    <path d="M1202 738 V759" class="main-flow"/>
    <path d="M731 806 V862" class="main-flow"/>

    <path d="M383 961 H444" class="main-flow"/>
    <path d="M701 961 H771" class="main-flow"/>
    <path d="M1024 961 H1094" class="main-flow"/>
  </g>
  <text x="500" y="709" text-anchor="middle" class="font flow-label">unique</text>
  <text x="919" y="660" text-anchor="middle" class="font flow-label">ambiguous</text>
  <text x="914" y="754" text-anchor="middle" class="font flow-label">unique supported</text>

  <!-- Legend -->
  <g id="legend" class="font">
    <path d="M50 1055 H96" class="main-flow"/>
    <text x="112" y="1061" font-size="14">Primary flow</text>
    <path d="M216 1055 H263" class="conditional-flow"/>
    <text x="278" y="1061" font-size="14">Conditional flow</text>
    <rect x="416" y="1042" width="25" height="25" fill="#eaf2ff" stroke="#0b3280" stroke-width="1"/>
    <text x="453" y="1061" font-size="14">Neural (LLM)</text>
    <rect x="572" y="1042" width="25" height="25" fill="#eefaf2" stroke="#0f6838" stroke-width="1"/>
    <text x="609" y="1061" font-size="14">Symbolic</text>
    <rect x="702" y="1042" width="25" height="25" fill="#effbff" stroke="#075e6e" stroke-width="1"/>
    <text x="739" y="1061" font-size="14">Neuro-Symbolic Decision</text>
    <rect x="927" y="1042" width="25" height="25" fill="#f1f6ff" stroke="#183762" stroke-width="1"/>
    <text x="965" y="1061" font-size="14">Formal Validation</text>
    <rect x="1106" y="1032" width="318" height="42" rx="10" fill="#fff" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/>
    <text x="1123" y="1060" font-size="14" font-weight="800">ABSTAIN</text>
    <text x="1195" y="1060" font-size="14">= No unique, supported candidate</text>
  </g>
</svg>
