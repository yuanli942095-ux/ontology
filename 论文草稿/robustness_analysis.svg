<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="960" viewBox="0 0 1728 960" role="img" aria-labelledby="title desc">
  <title id="title">Robustness Analysis of ECR-Repair</title>
  <desc id="desc">Vector recreation of a three-panel robustness analysis figure for ECR-Repair, reporting strict event success percentages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdfdfd"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fefefe"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f78bd"/>
      <stop offset="0.52" stop-color="#2f66ad"/>
      <stop offset="1" stop-color="#245997"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#df3734"/>
      <stop offset="1" stop-color="#c72c2a"/>
    </linearGradient>
    <filter id="softShadow" x="-35%" y="-10%" width="170%" height="125%">
      <feDropShadow dx="5" dy="0" stdDeviation="5" flood-color="#d8d8d8" flood-opacity="0.7"/>
    </filter>
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.2" flood-color="#cfcfcf" flood-opacity="0.9"/>
    </filter>
    <style>
      .serif { font-family: "Times New Roman", Times, Georgia, serif; }
      .panel { fill: url(#panelBg); stroke: #000; stroke-width: 1.7; }
      .axis { stroke: #000; stroke-width: 1.8; fill: none; }
      .tick { stroke: #000; stroke-width: 1.3; }
      .grid { stroke: #b9b9b9; stroke-width: 1.1; stroke-dasharray: 3 3; }
      .bar { stroke: #102844; stroke-width: 1.1; filter: url(#softShadow); }
      .red { stroke: #5a1414; }
      .value { font-size: 26px; font-weight: 400; fill: #000; }
      .tick-label { font-size: 27px; fill: #000; }
      .axis-label { font-size: 30px; font-weight: 700; fill: #000; }
      .panel-title { font-size: 32px; font-weight: 700; fill: #000; }
      .category { font-size: 28px; fill: #000; }
      .category-c { font-size: 24px; fill: #000; }
      .note { font-size: 30px; fill: #000; }
    </style>
  </defs>

  <rect width="1728" height="960" fill="url(#bg)"/>

  <text x="864" y="60" text-anchor="middle" class="serif" font-size="62" font-weight="700" filter="url(#titleShadow)">Robustness Analysis of ECR-Repair</text>
  <text x="864" y="105" text-anchor="middle" class="serif" font-size="32" font-style="italic">Metric: strict event success (%)</text>

  <!-- Panel containers -->
  <rect x="25" y="123" width="563" height="727" rx="9" class="panel"/>
  <rect x="602" y="123" width="500" height="727" rx="9" class="panel"/>
  <rect x="1116" y="123" width="576" height="727" rx="9" class="panel"/>
  <line x1="25" y1="753" x2="588" y2="753" stroke="#000" stroke-width="1.5"/>
  <line x1="602" y1="753" x2="1102" y2="753" stroke="#000" stroke-width="1.5"/>
  <line x1="1116" y1="753" x2="1692" y2="753" stroke="#000" stroke-width="1.5"/>

  <!-- Panel A -->
  <g id="panel-a" class="serif">
    <text x="43" y="168" font-size="39" font-weight="700">(a)</text>
    <text x="338" y="169" text-anchor="middle" class="panel-title">Candidate Pool Size</text>

    <g id="chart-a">
      <line x1="126" y1="236" x2="567" y2="236" class="grid"/>
      <line x1="126" y1="327.8" x2="567" y2="327.8" class="grid"/>
      <line x1="126" y1="419.6" x2="567" y2="419.6" class="grid"/>
      <line x1="126" y1="511.4" x2="567" y2="511.4" class="grid"/>
      <line x1="126" y1="603.2" x2="567" y2="603.2" class="grid"/>
      <path d="M126 236 V695 H567" class="axis"/>
      <line x1="119" y1="236" x2="126" y2="236" class="tick"/>
      <line x1="119" y1="327.8" x2="126" y2="327.8" class="tick"/>
      <line x1="119" y1="419.6" x2="126" y2="419.6" class="tick"/>
      <line x1="119" y1="511.4" x2="126" y2="511.4" class="tick"/>
      <line x1="119" y1="603.2" x2="126" y2="603.2" class="tick"/>
      <line x1="119" y1="695" x2="126" y2="695" class="tick"/>
      <text x="111" y="244" text-anchor="end" class="tick-label">100</text>
      <text x="111" y="336" text-anchor="end" class="tick-label">80</text>
      <text x="111" y="428" text-anchor="end" class="tick-label">60</text>
      <text x="111" y="520" text-anchor="end" class="tick-label">40</text>
      <text x="111" y="612" text-anchor="end" class="tick-label">20</text>
      <text x="111" y="704" text-anchor="end" class="tick-label">0</text>
      <text x="64" y="466" transform="rotate(-90 64 466)" text-anchor="middle" class="axis-label">Strict event success (%)</text>

      <rect x="162" y="237.7" width="78" height="457.3" class="bar" fill="url(#blueBar)"/>
      <rect x="309" y="241.2" width="78" height="453.8" class="bar" fill="url(#blueBar)"/>
      <rect x="455" y="242.0" width="78" height="453.0" class="bar" fill="url(#blueBar)"/>
      <text x="201" y="224" text-anchor="middle" class="value">99.62%</text>
      <text x="348" y="224" text-anchor="middle" class="value">98.86%</text>
      <text x="494" y="224" text-anchor="middle" class="value">98.48%</text>
      <text x="201" y="728" text-anchor="middle" class="category">k=3</text>
      <text x="348" y="728" text-anchor="middle" class="category">k=5</text>
      <text x="494" y="728" text-anchor="middle" class="category">k=10</text>
    </g>

    <text x="306.5" y="792" text-anchor="middle" class="note">Only minor degradation as the</text>
    <text x="306.5" y="827" text-anchor="middle" class="note">candidate pool expands.</text>
  </g>

  <!-- Panel B -->
  <g id="panel-b" class="serif">
    <text x="620" y="168" font-size="39" font-weight="700">(b)</text>
    <text x="856" y="169" text-anchor="middle" class="panel-title">LLM Backend</text>

    <g id="chart-b">
      <line x1="687" y1="236" x2="1068" y2="236" class="grid"/>
      <line x1="687" y1="327.8" x2="1068" y2="327.8" class="grid"/>
      <line x1="687" y1="419.6" x2="1068" y2="419.6" class="grid"/>
      <line x1="687" y1="511.4" x2="1068" y2="511.4" class="grid"/>
      <line x1="687" y1="603.2" x2="1068" y2="603.2" class="grid"/>
      <path d="M687 236 V695 H1068" class="axis"/>
      <line x1="680" y1="236" x2="687" y2="236" class="tick"/>
      <line x1="680" y1="327.8" x2="687" y2="327.8" class="tick"/>
      <line x1="680" y1="419.6" x2="687" y2="419.6" class="tick"/>
      <line x1="680" y1="511.4" x2="687" y2="511.4" class="tick"/>
      <line x1="680" y1="603.2" x2="687" y2="603.2" class="tick"/>
      <line x1="680" y1="695" x2="687" y2="695" class="tick"/>
      <text x="672" y="244" text-anchor="end" class="tick-label">100</text>
      <text x="672" y="336" text-anchor="end" class="tick-label">80</text>
      <text x="672" y="428" text-anchor="end" class="tick-label">60</text>
      <text x="672" y="520" text-anchor="end" class="tick-label">40</text>
      <text x="672" y="612" text-anchor="end" class="tick-label">20</text>
      <text x="672" y="704" text-anchor="end" class="tick-label">0</text>
      <text x="626" y="466" transform="rotate(-90 626 466)" text-anchor="middle" class="axis-label">Strict event success (%)</text>

      <rect x="737" y="237.7" width="90" height="457.3" class="bar" fill="url(#blueBar)"/>
      <rect x="917" y="239.5" width="90" height="455.5" class="bar" fill="url(#blueBar)"/>
      <text x="782" y="224" text-anchor="middle" class="value">99.62%</text>
      <text x="962" y="224" text-anchor="middle" class="value">99.24%</text>
      <text x="782" y="729" text-anchor="middle" class="category">DeepSeek</text>
      <text x="962" y="729" text-anchor="middle" class="category">Qwen</text>
    </g>

    <text x="852" y="792" text-anchor="middle" class="note">Performance remains stable</text>
    <text x="852" y="827" text-anchor="middle" class="note">across backends.</text>
  </g>

  <!-- Panel C -->
  <g id="panel-c" class="serif">
    <text x="1133" y="168" font-size="39" font-weight="700">(c)</text>
    <text x="1452" y="169" text-anchor="middle" class="serif" font-size="30" font-weight="700">Candidate-Identifier Permutation</text>

    <g id="chart-c">
      <line x1="1203" y1="236" x2="1668" y2="236" class="grid"/>
      <line x1="1203" y1="327.8" x2="1668" y2="327.8" class="grid"/>
      <line x1="1203" y1="419.6" x2="1668" y2="419.6" class="grid"/>
      <line x1="1203" y1="511.4" x2="1668" y2="511.4" class="grid"/>
      <line x1="1203" y1="603.2" x2="1668" y2="603.2" class="grid"/>
      <path d="M1203 236 V695 H1668" class="axis"/>
      <line x1="1196" y1="236" x2="1203" y2="236" class="tick"/>
      <line x1="1196" y1="327.8" x2="1203" y2="327.8" class="tick"/>
      <line x1="1196" y1="419.6" x2="1203" y2="419.6" class="tick"/>
      <line x1="1196" y1="511.4" x2="1203" y2="511.4" class="tick"/>
      <line x1="1196" y1="603.2" x2="1203" y2="603.2" class="tick"/>
      <line x1="1196" y1="695" x2="1203" y2="695" class="tick"/>
      <text x="1187" y="244" text-anchor="end" class="tick-label">100</text>
      <text x="1187" y="336" text-anchor="end" class="tick-label">80</text>
      <text x="1187" y="428" text-anchor="end" class="tick-label">60</text>
      <text x="1187" y="520" text-anchor="end" class="tick-label">40</text>
      <text x="1187" y="612" text-anchor="end" class="tick-label">20</text>
      <text x="1187" y="704" text-anchor="end" class="tick-label">0</text>
      <text x="1142" y="466" transform="rotate(-90 1142 466)" text-anchor="middle" class="axis-label">Strict event success (%)</text>

      <rect x="1239" y="237.7" width="81" height="457.3" class="bar" fill="url(#blueBar)"/>
      <rect x="1388" y="239.5" width="81" height="455.5" class="bar" fill="url(#blueBar)"/>
      <rect x="1547" y="542" width="81" height="153" class="bar red" fill="url(#redBar)"/>
      <text x="1279.5" y="224" text-anchor="middle" class="value">99.62%</text>
      <text x="1428.5" y="224" text-anchor="middle" class="value">99.24%</text>
      <text x="1587.5" y="524" text-anchor="middle" class="value">33.33%</text>
      <text x="1279.5" y="729" text-anchor="middle" class="category-c">Original</text>
      <text x="1428.5" y="729" text-anchor="middle" class="category-c">Permuted</text>
      <text x="1587.5" y="729" text-anchor="middle" class="category-c">Always-CAND002</text>
    </g>

    <text x="1404" y="792" text-anchor="middle" class="note">High performance under per-event permutation</text>
    <text x="1404" y="827" text-anchor="middle" class="note">rules out a literal ID shortcut.</text>
  </g>

  <text x="864" y="902" text-anchor="middle" class="serif" font-size="30">
    ECR-Repair remains robust to candidate-pool expansion, backend substitution, and candidate-ID permutation,
  </text>
  <text x="864" y="937" text-anchor="middle" class="serif" font-size="30">
    while a literal CAND002 shortcut fails badly.
  </text>
</svg>
